[package]
name = "ilar-tui"
description = "ilar TUI frontend (ratatui)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

[[bin]]
name = "ilar"
path = "src/main.rs"

[dependencies]
ilar = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
clap = { version = "4.6.6", features = ["derive"] }
tokio-util = "0.7.19"
chrono.workspace = true
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control", "image-data"] }
serde_json.workspace = true
serde.workspace = true
# `ilar serve`, the read-only web view. Minimal axum: no http2, no
# form/multipart/ws, no tracing — the router is GET-only by design.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
reqwest = { workspace = true }
