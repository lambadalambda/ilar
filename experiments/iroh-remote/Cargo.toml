[package]
name = "iroh-remote-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Not a member of the ilar workspace: the spike must not touch the gate.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spike-host"
path = "src/main.rs"

[dependencies]
# 1.4.2 and 1.5.0 are less than two weeks old on 2026-11-26.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["full"] }
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
