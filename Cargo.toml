[workspace]
resolver = "3"
members = ["crates/ilar", "crates/ilar-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
authors = ["lainsoykaf"]

[workspace.dependencies]
ilar = { path = "crates/ilar" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
lto = "thin"
strip = true
